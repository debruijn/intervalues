# This workflow installs Python dependencies, runs tests, and lints with Ruff.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python - Ruff and pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.0"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install quality dependencies
      run: uv sync --locked --no-install-project --no-default-groups --group quality
    - name: Lint with Ruff
      run: uv run --no-sync ruff check intervalues tests examples
    - name: Type check with Mypy
      run: uv run --no-sync mypy intervalues tests/test_public_type_contract.py

  python-only-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15", "pypy3.10"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.0"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install test dependencies
      run: uv sync --locked --no-install-project --no-default-groups --group test
    - name: Test without the Rust extension
      run: |
        PYTHONPATH="$PYTHONPATH:$PWD" uv run --no-sync python -m pytest -q -k "not many"

  rust-extension:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "pypy3.10"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.0"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
    - name: Install test and build dependencies
      run: uv sync --locked --no-install-project --no-default-groups --group test --group rust-build
    - name: Build Rust extension
      working-directory: rust
      run: uv run --project .. --no-sync maturin build --release --locked --interpreter ../.venv/bin/python
    - name: Install Rust extension
      run: uv pip install --python .venv/bin/python rust/target/wheels/*.whl
    - name: Test with the Rust extension
      run: |
        PYTHONPATH="$PYTHONPATH:$PWD" uv run --no-sync python -m pytest
    - name: Run examples
      run: |
        PYTHONPATH="$PYTHONPATH:$PWD" uv run --no-sync python examples/example_maturin.py
        PYTHONPATH="$PYTHONPATH:$PWD" uv run --no-sync python examples/example_airfield_coverage.py
        PYTHONPATH="$PYTHONPATH:$PWD" uv run --no-sync python examples/example_count_criteria_met.py
        PYTHONPATH="$PYTHONPATH:$PWD" uv run --no-sync python examples/example_student_regulations_impact.py
