# This workflow installs Python dependencies, runs tests, and lints with Ruff.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python - Ruff and pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.16.9 mypy==1.11.2 pytest maturin
    - name: Lint with Ruff
      run: ruff check intervalues tests examples
    - name: Type check with Mypy
      run: mypy intervalues tests/test_public_type_contract.py
    - name: Test without the Rust extension
      run: |
        export PYTHONPATH="$PYTHONPATH:$PWD"
        pytest -q -k "not many"
    - name: Build and install Rust extension
      run: |
        apt-get update && apt-get install curl build-essential -y
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        export PATH="$HOME/.cargo/bin:$PATH"
        cd rust/
        maturin build
        cd ..
        pip install rust/target/wheels/*.whl
    - name: Test with the Rust extension
      run: |
        export PYTHONPATH="$PYTHONPATH:$PWD"
        pytest
    - name: Run examples
      run: |
        export PYTHONPATH="$PYTHONPATH:$PWD"
        python3 examples/example_maturin.py
        python3 examples/example_airfield_coverage.py
        python3 examples/example_count_criteria_met.py
        python3 examples/example_student_regulations_impact.py
        
