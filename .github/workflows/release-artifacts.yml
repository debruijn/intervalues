name: Release artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the caller's ref
        required: false
        type: string
      release_tag:
        description: Release tag to record in the artifact manifest
        required: false
        type: string
      artifact_name:
        description: Name for the uploaded artifact
        required: false
        type: string
  workflow_dispatch:
  pull_request:
    branches: ["development", "main"]
    paths:
      - ".github/release/**"
      - ".github/workflows/release-artifacts.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish-release.yml"
      - "MANIFEST.in"
      - "VERSION"
      - "intervalues/**"
      - "pyproject.toml"
      - "rust/**"
      - "setup.cfg"
      - "tests/release_wheel_smoke.py"
      - "tests/test_release_*.py"
      - "tests/test_testpypi_run_validation.py"

permissions:
  contents: read

jobs:
  prepare-source:
    name: Prepare source distribution and Python fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Build source distribution
        run: |
          mkdir -p dist sdist-source wheelhouse-fallback release-source
          uv build --sdist --out-dir dist
          tar -xzf dist/intervalues-*.tar.gz --strip-components=1 -C sdist-source
          cp -a sdist-source sdist-source-pyonly
          python .github/release/prepare_build_source.py \
            sdist-source-pyonly \
            --python-only \
            --free-threaded
          uv build sdist-source-pyonly \
            --wheel \
            --out-dir wheelhouse-fallback \
            --python 3.12
          cp dist/*.tar.gz wheelhouse-fallback/*.whl release-source/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intervalues-source
          path: release-source/*
          if-no-files-found: error
          retention-days: 90

  build-wheels:
    name: Build ${{ matrix.label }} wheels
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            artifact: linux-x86_64
            runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            build: cp312-manylinux_x86_64 pp312-manylinux_x86_64
            enable: pypy
          - label: Linux aarch64
            artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            build: cp312-manylinux_aarch64
          - label: macOS x86_64
            artifact: macos-x86_64
            runner: macos-15-intel
            platform: macos
            arch: x86_64
            build: cp312-macosx_x86_64
            deployment_target: "10.13"
          - label: macOS arm64
            artifact: macos-arm64
            runner: macos-15
            platform: macos
            arch: arm64
            build: cp312-macosx_arm64
            deployment_target: "11.0"
          - label: Windows x86_64
            artifact: windows-x86_64
            runner: windows-2025
            platform: windows
            arch: AMD64
            build: cp312-win_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: matrix.platform != 'linux'
        with:
          toolchain: 1.83.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intervalues-source
          path: build-inputs
          digest-mismatch: error
      - name: Prepare Rust-enabled build source
        run: |
          mkdir -p sdist-source-rust wheelhouse
          tar -xzf build-inputs/intervalues-*.tar.gz \
            --strip-components=1 \
            -C sdist-source-rust
          python .github/release/prepare_build_source.py \
            sdist-source-rust \
            --require-rust-extension
      - name: Build native wheel targets
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ENABLE: ${{ matrix.enable }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
            | sh -s -- -y --profile minimal --default-toolchain 1.83.0 --no-modify-path
          CIBW_ENVIRONMENT_LINUX: 'PATH=$PATH:$HOME/.cargo/bin CARGO_BUILD_JOBS=1'
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
            CARGO_BUILD_JOBS=1
          CIBW_ENVIRONMENT_WINDOWS: CARGO_BUILD_JOBS=1
          CIBW_TEST_COMMAND: python {project}/tests/release_wheel_smoke.py
        run: |
          uv tool run --from cibuildwheel==4.3.4 cibuildwheel \
            --platform "${{ matrix.platform }}" \
            --output-dir "$PWD/wheelhouse" \
            "$PWD/sdist-source-rust"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intervalues-wheel-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 90

  validate-artifacts:
    name: Validate and stage release artifacts
    needs: [prepare-source, build-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intervalues-source
          path: source-artifacts
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: intervalues-wheel-*
          path: wheelhouse
          merge-multiple: true
          digest-mismatch: error
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Assemble distribution artifacts
        run: |
          mkdir -p dist wheelhouse
          cp source-artifacts/*.tar.gz dist/
          cp source-artifacts/*.whl wheelhouse/
      - name: Validate release artifacts
        run: |
          python .github/release/validate_artifacts.py \
            --dist-dir dist \
            --wheel-dir wheelhouse
      - name: Stage validated artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir release-artifacts
          cp dist/*.tar.gz wheelhouse/*.whl release-artifacts/
          printf 'release_tag=%s\nsource_sha=%s\n' \
            "$RELEASE_TAG" "$(git rev-parse HEAD)" \
            > release-artifacts/RELEASE-MANIFEST.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Test CPython 3.12 stable-ABI wheel on Python 3.15
        run: |
          python -m venv "$RUNNER_TEMP/cp315-wheel-smoke"
          "$RUNNER_TEMP/cp315-wheel-smoke/bin/python" -m pip install \
            --no-deps \
            --no-index \
            wheelhouse/intervalues-*-cp312-abi3-manylinux*_x86_64.whl
          "$RUNNER_TEMP/cp315-wheel-smoke/bin/python" \
            tests/release_wheel_smoke.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13t"
      - name: Test pure-Python fallback wheel on CPython 3.13t
        run: |
          uv venv --python 3.13t "$RUNNER_TEMP/cp313t-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/cp313t-wheel-smoke/bin/python" \
            --no-deps \
            --no-index \
            wheelhouse/intervalues-*-py3-none-any.whl
          "$RUNNER_TEMP/cp313t-wheel-smoke/bin/python" \
            tests/release_wheel_smoke.py \
            --python-fallback
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "pypy3.12"
      - name: Test pure-Python fallback wheel on PyPy 3.12
        run: |
          uv venv --python pypy3.12 "$RUNNER_TEMP/pp312-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/pp312-wheel-smoke/bin/python" \
            --no-deps \
            --no-index \
            wheelhouse/intervalues-*-py3-none-any.whl
          "$RUNNER_TEMP/pp312-wheel-smoke/bin/python" \
            tests/release_wheel_smoke.py \
            --python-fallback
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name || 'intervalues-release-artifacts' }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 90
