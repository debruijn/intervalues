name: Release artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the caller's ref
        required: false
        type: string
      release_tag:
        description: Release tag to record in the artifact manifest
        required: false
        type: string
      artifact_name:
        description: Name for the uploaded artifact
        required: false
        type: string
  workflow_dispatch:
  pull_request:
    branches: ["development", "main"]
    paths:
      - ".github/release/**"
      - ".github/workflows/release-artifacts.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish-release.yml"
      - "MANIFEST.in"
      - "VERSION"
      - "intervalues/**"
      - "pyproject.toml"
      - "rust/**"
      - "setup.cfg"
      - "tests/release_wheel_smoke.py"
      - "tests/test_release_*.py"
      - "tests/test_testpypi_run_validation.py"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build and validate Linux artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Build source distribution
        run: |
          mkdir -p dist sdist-source wheelhouse wheelhouse-cp313t
          uv build --sdist --out-dir dist
          tar -xzf dist/intervalues-*.tar.gz --strip-components=1 -C sdist-source
          cp -a sdist-source sdist-source-rust
          python .github/release/prepare_build_source.py \
            sdist-source-rust \
            --require-rust-extension
          cp -a sdist-source sdist-source-cp313t
          python .github/release/prepare_build_source.py \
            sdist-source-cp313t \
            --python-only \
            --free-threaded
      - name: Build stable-ABI and PyPy manylinux wheels
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: cp310-manylinux_x86_64 pp311-manylinux_x86_64
          CIBW_ENABLE: pypy
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
            | sh -s -- -y --profile minimal --default-toolchain 1.83.0 --no-modify-path
          CIBW_ENVIRONMENT_LINUX: 'PATH=$PATH:$HOME/.cargo/bin CARGO_BUILD_JOBS=1'
          CIBW_TEST_COMMAND: python {project}/tests/release_wheel_smoke.py
        run: |
          uv tool run --from cibuildwheel==3.2.1 cibuildwheel \
            --platform linux \
            --output-dir "$PWD/wheelhouse" \
            "$PWD/sdist-source-rust"
      - name: Build pure-Python fallback wheel
        run: |
          uv build sdist-source-cp313t \
            --wheel \
            --out-dir wheelhouse-cp313t \
            --python 3.10
      - name: Combine wheel outputs
        run: cp wheelhouse-cp313t/*.whl wheelhouse/
      - name: Validate release artifacts
        run: |
          python .github/release/validate_artifacts.py \
            --dist-dir dist \
            --wheel-dir wheelhouse
      - name: Stage validated artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir release-artifacts
          cp dist/*.tar.gz wheelhouse/*.whl release-artifacts/
          printf 'release_tag=%s\nsource_sha=%s\n' \
            "$RELEASE_TAG" "$(git rev-parse HEAD)" \
            > release-artifacts/RELEASE-MANIFEST.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Test CPython stable-ABI wheel on Python 3.15
        run: |
          python -m venv "$RUNNER_TEMP/cp315-wheel-smoke"
          "$RUNNER_TEMP/cp315-wheel-smoke/bin/python" -m pip install \
            --no-deps \
            --no-index \
            wheelhouse/intervalues-*-cp310-abi3-*.whl
          "$RUNNER_TEMP/cp315-wheel-smoke/bin/python" \
            tests/release_wheel_smoke.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13t"
      - name: Test pure-Python fallback wheel on CPython 3.13t
        run: |
          uv venv --python 3.13t "$RUNNER_TEMP/cp313t-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/cp313t-wheel-smoke/bin/python" \
            --no-deps \
            --no-index \
            wheelhouse/intervalues-*-py3-none-any.whl
          "$RUNNER_TEMP/cp313t-wheel-smoke/bin/python" \
            tests/release_wheel_smoke.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "pypy3.10"
      - name: Test pure-Python fallback wheel on PyPy 3.10
        run: |
          uv venv --python pypy3.10 "$RUNNER_TEMP/pp310-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/pp310-wheel-smoke/bin/python" \
            --no-deps \
            --no-index \
            wheelhouse/intervalues-*-py3-none-any.whl
          "$RUNNER_TEMP/pp310-wheel-smoke/bin/python" \
            tests/release_wheel_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name || 'intervalues-linux-release-artifacts' }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 90
